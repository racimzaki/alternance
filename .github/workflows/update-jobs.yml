name: Update jobs

on:
  workflow_dispatch:

  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le repository
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recuperer les offres
        run: node scripts/update-jobs.mjs

      - name: Sauvegarder les nouvelles offres
        run: |
          git config user.name "AlternanceRadar Bot"
          git config user.email "actions@github.com"

          git add public/jobs.json

          if git diff --cached --quiet; then
            echo "Aucune modification des offres."
          else
            git commit -m "Update active job offers"
            git push
          fi
